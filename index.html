<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- App / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- IMPORTANT:
         The website is LIGHT ONLY.
         Prevent browsers from automatically converting
         the page into a dark color scheme. -->
    <meta name="color-scheme" content="only light" />

    <meta name="theme-color" content="#faf7f1" />
    <meta name="msapplication-TileColor" content="#faf7f1" />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <title>Growth Station — Launch Playbook 2026</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!--
      Small critical style.

      This is intentionally minimal.
      We DON'T try to detect Samsung.
      We simply declare that the whole application
      uses one light color scheme.
    -->
    <style>
      :root {
        color-scheme: only light;
      }

      html {
        color-scheme: only light;
        background: #faf7f1;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #faf7f1;
        color: #0d2b1e;
      }

      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
